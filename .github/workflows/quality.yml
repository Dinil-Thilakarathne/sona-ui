name: Quality Checks

on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  quality:
    name: Registry, TypeScript, and Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate registry metadata
        run: bun run check:registry

      - name: Build agent resources
        run: bun run build:agent-resources

      - name: Validate agent resources
        run: bun run check:agent-resources

      - name: Validate agent skill
        run: bun run check:agent-skill

      - name: Check agent contracts
        run: bun run check:agent-contracts

      - name: Build generated registry artifacts
        run: bun run build:registry

      - name: Verify generated consumers
        run: bun run check:registry-consumers

      - name: Typecheck
        run: bun run typecheck

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start docs site
        run: |
          bun run dev -- --hostname 127.0.0.1 > /tmp/sona-ui-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/docs/accordion > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sona-ui-next.log
          exit 1

      - name: Accessibility scan
        env:
          A11Y_BASE_URL: http://127.0.0.1:3000
        run: bun run check:a11y
